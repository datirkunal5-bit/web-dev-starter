<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designing Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
 <div class=" mx-52 mt-20  flex flex-wrap border-2 rounded-lg shadow-lg">
    <div class="h-14 bg-linear-to-t from-sky-500 to-indigo-500 text-white h-20 flex items-center justify-center font-bold w-full rounded-lg border-2 border-black">News You Can Trust</div>
     
    <div class=" text-center mt-6">
       <h3 class="text-xl font-bold ">Stay up To date with Latest </h3> 
       <p>Subscribe to our newsletter for the latest news straight into your inbox. </p>
       <form action="" class="flex flex-wrap">
        <input type="text" placeholder="your@gmail.com" class="w-full mx-52 mt-4 p-2 border border-gray-300  text-center rounded">
        <button type="submit" class=" bg-blue-500 w-full mx-52 mt-4 p-2 rounded-full font-bold hover:bg-green-600">Subscribe Now</button>

       </form>
       <p class="mt-10 font-semibold">We value your Privacy</p>
    
    </div>
    </div>
</body>

</html>
